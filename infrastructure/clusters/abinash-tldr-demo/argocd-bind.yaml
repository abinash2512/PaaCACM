apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rosa-hcp-placement
  namespace: ns-rosa-hcp
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            apps.open-cluster-management.io/gitops: "true"
---
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: rosa-hcp-argo-binding
  namespace: ns-rosa-hcp
spec:
  argoServer:
    cluster: local-cluster
    argoNamespace: openshift-gitops # Adjust if your ArgoCD is in a custom namespace
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: rosa-hcp-placement
